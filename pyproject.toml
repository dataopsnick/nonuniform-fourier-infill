[build-system]
requires = ["setuptools>=61.0.0", "wheel", "Cython>=3.0.0", "oldest-supported-numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "nufi"
version = "0.1.0"
description = "A high-performance, GPU-accelerated non-uniform Fourier infilling library. Note: For GPU acceleration, a CUDA-capable or MPS-capable PyTorch must be installed separately."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.6.0",
    "pandas>=1.2.0",
    "scikit-learn>=1.0.0",
    "torch>=2.0.0"
]

[project.optional-dependencies]
# Let torch supply its own CUDA runtime; avoid version conflicts.
# GPU users simply need a CUDA-capable torch wheel (e.g., `pip install torch --index-url https://download.pytorch.org/whl/cu118`).
gpu = []

[tool.setuptools.packages.find]
include = ["nufi*"]
