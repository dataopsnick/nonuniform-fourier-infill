[build-system]
requires = ["setuptools>=61.0.0", "wheel", "Cython>=3.0.0", "oldest-supported-numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "nufi"
version = "0.1.0"
description = "A high-performance, GPU-accelerated non-uniform Fourier infilling library. Note: For GPU acceleration, a CUDA-capable or MPS-capable PyTorch must be installed separately."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE*"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21.6",
    "scipy>=1.6.0",
    "pandas>=1.2.0",
    "scikit-learn>=1.0.0"
]

[project.optional-dependencies]
# GPU acceleration; installs PyTorch. For CUDA/MPS-specific wheels, override:
#   pip install nufi[gpu] --index-url https://download.pytorch.org/whl/cu118
gpu = ["torch>=2.0.0"]

[tool.setuptools.packages.find]
include = ["nufi*"]
